services:
  # ── PostgreSQL Database ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: manakai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-manakai}
      POSTGRES_USER: ${POSTGRES_USER:-manakai_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-manakai_user} -d ${POSTGRES_DB:-manakai} || pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - manakai-network

  # ── FastAPI RAG Service & ChromaDB ────────────────────────────────────────
  rag-service:
    build:
      context: ./rag-service
      dockerfile: Dockerfile
    container_name: manakai-rag-service
    restart: unless-stopped
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      PYTHONPATH: /app/src
    volumes:
      # Persistent vector database storage containing indexed BIS standards
      - ./rag-service/data/chromadb:/app/data/chromadb
    ports:
      - "8000:8000"
    networks:
      - manakai-network

  # ── Spring Boot Backend API Gateway ───────────────────────────────────────
  backend-api:
    build:
      context: ./backend-api
      dockerfile: Dockerfile
    container_name: manakai-backend-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rag-service:
        condition: service_started
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-manakai}
      POSTGRES_USER: ${POSTGRES_USER:-manakai_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      RAG_SERVICE_URL: http://rag-service:8000
      JWT_SECRET: ${JWT_SECRET:-manakai-super-secret-jwt-key-for-sih-2026-demo-change-in-production}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:80,http://localhost:5173,http://localhost}
    ports:
      - "8080:8080"
    networks:
      - manakai-network

  # ── React Frontend (Served via Nginx Reverse Proxy) ──────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: manakai-frontend
    restart: unless-stopped
    depends_on:
      backend-api:
        condition: service_started
    ports:
      - "3000:80"
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - manakai-network

networks:
  manakai-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
